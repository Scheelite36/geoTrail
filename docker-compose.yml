version: '3.8'

services:
  geo-postgres:
    image: postgis/postgis:16-3.4
    container_name: geo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo123}
      POSTGRES_DB: geology
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_sql:/docker-entrypoint-initdb.d
    mem_limit: 1g

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-geo12345}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: 1g

  neo4j-kg:
    image: neo4j:5-community
    container_name: neo4j-kg
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-geo12345}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7688:7687"
    volumes:
      - neo4j_kg_data:/data
    mem_limit: 1g

  geo-api:
    build: ./app
    container_name: geo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - geo-postgres
      - qdrant
      - neo4j
    environment:
      # 数据库主机名（容器内通过 service name 互联）
      - DB_HOST=geo-postgres
      - QDRANT_HOST=qdrant
      # ↓↓↓ 2026-06-17 追加：原代码 main.py 第 26 行 NEO4J_URI 默认 localhost，容器里连不上，必须显式指过去
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-geo12345}
      # ↓↓↓ 2026-06-17 追加：LangGraph Agent 调用火山方舟 Coding Plan
      # base_url 是 OpenAI 兼容协议入口；model 必须是火山白名单内的模型名
      # （deepseek-v4-flash 不在白名单会报 UnsupportedModel，改用 deepseek-v3-2）
      # API Key 从 .env 读取（见 .env.example），切勿硬编码进仓库
      - AGENT_LLM_API_KEY=${AGENT_LLM_API_KEY}
      - AGENT_LLM_BASE_URL=https://ark.cn-beijing.volces.com/api/coding/v3
      - AGENT_LLM_MODEL=deepseek-v4-flash
    volumes:
      - fastembed_cache:/tmp/fastembed_cache

volumes:
  pgdata:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_kg_data:
  fastembed_cache:
